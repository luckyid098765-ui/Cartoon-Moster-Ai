name: Publish Prebuilt Android Debug APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apk-distribution/app-debug.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-apk:
    name: Validate and Publish Prebuilt APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate prebuilt APK and SHA-256 checksum
        run: |
          set -euo pipefail
          APK_PATH="apk-distribution/app-debug.apk"
          SHA_PATH="apk-distribution/app-debug.apk.sha256"

          if [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "ERROR: $APK_PATH is missing or empty."
            exit 1
          fi

          if [ ! -f "$SHA_PATH" ] || [ ! -s "$SHA_PATH" ]; then
            echo "ERROR: $SHA_PATH is missing or empty."
            exit 1
          fi

          (cd apk-distribution && sha256sum -c app-debug.apk.sha256)
          unzip -tq "$APK_PATH"

          APK_BYTES=$(stat -c%s "$APK_PATH")
          APK_HUMAN=$(du -h "$APK_PATH" | awk '{print $1}')
          APK_SHA256=$(awk '{print $1}' "$SHA_PATH")
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          {
            echo "APK_BYTES=${APK_BYTES}"
            echo "APK_HUMAN=${APK_HUMAN}"
            echo "APK_SHA256=${APK_SHA256}"
            echo "RELEASE_TAG=${RELEASE_TAG}"
          } >> "$GITHUB_ENV"

      - name: Publish GitHub Release with existing APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES=$(printf 'Prebuilt Android debug APK compiled in Google AI Studio.\n\n- **Asset:** `app-debug.apk`\n- **Size:** %s (%s bytes)\n- **SHA-256:** `%s`' "$APK_HUMAN" "$APK_BYTES" "$APK_SHA256")
          cd apk-distribution
          gh release create "$RELEASE_TAG" "app-debug.apk" \
            --title "Android Debug APK (Build ${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT})" \
            --notes "$NOTES" \
            --latest

      - name: Write Release Job Summary
        if: success()
        run: |
          {
            echo "## Android Debug APK Release Published"
            echo ""
            echo "- **Release Tag:** \`${RELEASE_TAG}\`"
            echo "- **APK Size:** ${APK_HUMAN} (${APK_BYTES} bytes)"
            echo "- **SHA-256:** \`${APK_SHA256}\`"
            echo "- **GitHub Release Page:** https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
            echo "- **Direct Latest APK Download URL:** https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"
          } >> "$GITHUB_STEP_SUMMARY"
